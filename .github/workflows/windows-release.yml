name: Windows package verification

on:
  push:
    branches: [experimental/vulkan-capture-poc]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'assets/**'
      - 'install-windows.ps1'
      - 'native/*windows*'
      - 'requirements.txt'
      - 'run.py'
      - 'tests/**'
      - 'tools/build_windows_release.py'
      - 'vd.cmd'
      - 'vd/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Build native DXGI worker
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Auxiliary\Build\vcvars64.bat`) do call "%%I"
          call native\build_windows_capture.cmd || exit /b 1
      - name: Run Windows timing and capture contract tests
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_windows_capture.py tests/test_windows_input.py tests/test_windows_launch.py tests/test_windows_preflight.py tests/test_rare_miss_regressions.py tests/test_engine.py
      - name: Verify portable package and installer
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'build/releases/vd-windows-x64.zip'
          python tools/build_windows_release.py --output $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$( (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() )  vd-windows-x64.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'VD install smoke test'
          & ./install-windows.ps1 -Tag v0.0.0-ci -ArchivePath $zip -PreflightOnly
          & ./install-windows.ps1 -Tag v0.0.0-ci -PreflightOnly
          & (Join-Path $env:LOCALAPPDATA 'VD-Solver/v0.0.0-ci/vd.cmd') preflight
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vd-windows-x64-release
          path: |
            build/releases/vd-windows-x64.zip
            build/releases/vd-windows-x64.zip.sha256
            install-windows.ps1
          if-no-files-found: error

  public-installer:
    runs-on: windows-2025
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Install the published package using Windows PowerShell
        shell: powershell
        run: |
          $releases = Invoke-RestMethod -UseBasicParsing "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=10"
          $release = $releases | Where-Object { -not $_.draft -and $_.assets.name -contains 'install-windows.ps1' } | Select-Object -First 1
          if (-not $release) { throw 'No published installer was found.' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'VD public install test'
          $script = Join-Path $env:RUNNER_TEMP 'install-windows.ps1'
          $asset = $release.assets | Where-Object { $_.name -eq 'install-windows.ps1' }
          Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile $script
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Tag $release.tag_name -PreflightOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:LOCALAPPDATA "VD-Solver/$($release.tag_name)/vd.cmd"
          & $installed preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
